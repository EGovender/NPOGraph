<svg xmlns="http://www.w3.org/2000/svg" width="720" height="120" viewBox="0 0 720 120" role="img" aria-labelledby="title desc">
  <title id="title">CommonGood Atlas</title>
  <desc id="desc">A navy and green connected globe mark beside the CommonGood Atlas wordmark.</desc>
  <defs>
    <style>
      .navy{stroke:#082f5b;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .green{stroke:#4f9667;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .nodeN{fill:#082f5b}
      .nodeG{fill:#4f9667}
      .word{font-family:Inter, Aptos, 'Segoe UI', Arial, sans-serif;font-weight:750;letter-spacing:-1px}
    </style>
  </defs>

  <g transform="translate(10,10)">
    <path d="M50 2 91 25v50L50 98 9 75V25Z" class="green" stroke-width="3"/>
    <circle cx="50" cy="50" r="29" class="navy" stroke-width="2.5"/>
    <path d="M21 50h58M50 21c12 12 12 46 0 58M50 21c-12 12-12 46 0 58M28 34c14 8 30 8 44 0M28 66c14-8 30-8 44 0" class="navy" stroke-width="1.8"/>
    <path d="M28 34 50 50 72 34M28 66 50 50 72 66M50 21v58" class="navy" stroke-width="1.8"/>
    <circle cx="28" cy="34" r="4.8" class="nodeG"/>
    <circle cx="72" cy="34" r="4.8" class="nodeN"/>
    <circle cx="50" cy="50" r="5.2" class="nodeN"/>
    <circle cx="28" cy="66" r="4.8" class="nodeN"/>
    <circle cx="72" cy="66" r="4.8" class="nodeG"/>
    <circle cx="50" cy="21" r="4.8" class="nodeG"/>
    <circle cx="50" cy="79" r="4.8" class="nodeG"/>
  </g>

  <text x="126" y="76" class="word" font-size="54" fill="#082f5b">CommonGood</text>
  <text x="505" y="76" class="word" font-size="54" fill="#4f9667">Atlas</text>
</svg>
